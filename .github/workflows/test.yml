name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Create test database
        run: |
          PGPASSWORD=1234 psql -h localhost -U root -d postgres -c "CREATE DATABASE event_server_test;"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Proves the migration chain builds the schema from scratch —
      # the same thing DB_MIGRATIONS_RUN=true does on deploy.
      - name: Run migrations on a clean database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: migration_check
          DB_USER: root
          DB_PASSWORD: "1234"
        run: |
          PGPASSWORD=1234 psql -h localhost -U root -d postgres -c "CREATE DATABASE migration_check;"
          npm run migration:run
          COUNT=$(PGPASSWORD=1234 psql -h localhost -U root -d migration_check -t -A -c "SELECT count(*) FROM migrations_typeorm;")
          echo "Applied migrations: $COUNT"
          [ "$COUNT" -gt 0 ]

  docker-build::
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: event-server

      # Dockerfile copies the toolkit from a sibling directory
      - uses: actions/checkout@v4
        with:
          repository: fwmakc/api-server-toolkit
          ref: v0.20.0
          path: api-server-toolkit

      # dist/ is gitignored in the toolkit — build it for the Docker COPY
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build toolkit
        run: cd api-server-toolkit && npm install --legacy-peer-deps --ignore-scripts && npx tsc

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: event-server/Dockerfile
          push: false
