name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Create test database
        run: |
          PGPASSWORD=1234 psql -h localhost -U root -d postgres -c "CREATE DATABASE event_server_test;"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Proves the migration chain builds the schema from scratch —
      # the same thing the service does on every boot (migrationsRun is hardcoded).
      - name: Run migrations on a clean database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: migration_check
          DB_USER: root
          DB_PASSWORD: "1234"
        run: |
          PGPASSWORD=1234 psql -h localhost -U root -d postgres -c "CREATE DATABASE migration_check;"
          npm run migration:run
          COUNT=$(PGPASSWORD=1234 psql -h localhost -U root -d migration_check -t -A -c "SELECT count(*) FROM migrations_typeorm;")
          echo "Applied migrations: $COUNT"
          [ "$COUNT" -gt 0 ]

      # Entities must not drift from the migration chain: generate must find
      # zero diff. The app auto-migrates on boot, so entities and migrations
      # have to agree — otherwise a fresh deployment gets the wrong schema.
      - name: Check entities have no drift against migrations
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: migration_check
          DB_USER: root
          DB_PASSWORD: "1234"
        run: |
          RESULT=$(npm run typeorm migration:generate -- -d ./src/config/typeorm.config.ts ./drift-probe 2>&1) || true
          rm -f *-drift-probe.ts 2>/dev/null; rm -rf drift-probe
          echo "$RESULT" | tail -3
          echo "$RESULT" | grep -q "No changes in database schema were found" \
            || { echo "::error::Entities drifted from migrations — run npm run migration:auto and commit the generated migration"; exit 1; }

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: event-server

      # Resolve the toolkit ref from the service's package.json pin so a
      # toolkit release never requires editing this workflow.
      - name: Resolve sibling pins from package.json
        run: |
          echo "TOOLKIT_REF=$(node -p "require('./event-server/package.json').dependencies['api-server-toolkit'].split('#')[1]")" >> $GITHUB_ENV

      # Dockerfile copies the toolkit from a sibling directory
      - uses: actions/checkout@v4
        with:
          repository: fwmakc/api-server-toolkit
          ref: ${{ env.TOOLKIT_REF }}
          path: api-server-toolkit

      # dist/ is gitignored in the toolkit — build it for the Docker COPY
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build toolkit
        run: cd api-server-toolkit && npm install --legacy-peer-deps --ignore-scripts && npx tsc

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: event-server/Dockerfile
          push: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only; high/critical fails the build unless a
      # dated, justified allowlist entry exists in the script itself.
      - name: Dependency audit gate (high/critical, runtime)
        run: node scripts/audit-gate.mjs

      # Software bill of materials, shipped as a CI artifact on every push
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  wiring:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Wiring — real boot, probe writes (TZ=UTC)
        run: npm run test:wiring

      - name: Wiring — real boot, probe writes (TZ=Europe/Moscow)
        run: npm run test:wiring
        env:
          TZ: Europe/Moscow
