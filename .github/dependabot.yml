version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Own libraries: git pins move per release, by hand
      # (dependabot PRs against them would race the release flow)
      - dependency-name: api-server-toolkit
      - dependency-name: event-server
    groups:
      # Routine minor/patch bumps in one PR; majors stay separate
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
